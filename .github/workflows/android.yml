name: Build Android APK

on:
  push:
    tags: ["v*"]          # same tags as the Windows build; the APK is added to that Release
  workflow_dispatch:      # or run it manually from the Actions tab

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS deps and build the UI
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Generate the Capacitor Android project
        run: npx cap add android

      - name: Download speech model into assets
        run: |
          curl -sSfL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p android/app/src/main/assets/model
          cp -r vosk-model-small-en-us-0.15/* android/app/src/main/assets/model/

      - name: Merge Name Alert native code
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: python3 scripts/patch_android.py

      - name: Build APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NameAlert-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NameAlert-android
          path: android/NameAlert-android.apk

      - name: Add APK to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/NameAlert-android.apk
